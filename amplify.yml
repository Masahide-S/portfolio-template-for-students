version: 1
frontend:
  phases:
    preBuild:
      commands:
        - corepack enable
        - corepack prepare pnpm@10.12.4 --activate
        - pnpm install
    build:
      commands:
        # Next.js用の環境変数ファイルを生成
        - echo "APP_AWS_REGION=$APP_AWS_REGION" >> .env.production
        - echo "DYNAMODB_TABLE_NAME=$DYNAMODB_TABLE_NAME" >> .env.production
        - echo "ADMIN_PASSWORD=$ADMIN_PASSWORD" >> .env.production
        - echo "JWT_KEY=$JWT_KEY" >> .env.production
        # SSR実行環境(Server Actions等)がDynamoDBにアクセスするための認証情報
        # AmplifyのSSRコンピュート用ロールはビルド毎に再生成される自動ロールのため、
        # DynamoDB権限を持たせられない。代わりにIAMユーザーのアクセスキーを使う。
        - echo "APP_AWS_ACCESS_KEY_ID=$APP_AWS_ACCESS_KEY_ID" >> .env.production
        - echo "APP_AWS_SECRET_ACCESS_KEY=$APP_AWS_SECRET_ACCESS_KEY" >> .env.production
        # 管理画面での保存をトリガーに再ビルドするためのAmplify Webhook URL
        - echo "AMPLIFY_DEPLOY_WEBHOOK_URL=$AMPLIFY_DEPLOY_WEBHOOK_URL" >> .env.production
        # Next.jsのビルドを実行
        - pnpm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache