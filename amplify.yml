version: 1
frontend:
  phases:
    preBuild:
      commands:
        # corepackを有効化してpnpmを使えるようにする
        - corepack enable
        - corepack prepare pnpm@latest --activate
        - pnpm install
    build:
      commands:
        - pnpm run build
  artifacts:
    # 静的エクスポートされたファイルが出力される 'out' フォルダを指定
    baseDirectory: out
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*