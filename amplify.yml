version: 1
frontend:
  phases:
    preBuild:
      commands:
        # corepackを有効化してpnpmを使えるようにする
        - corepack enable
        - corepack prepare pnpm@latest --activate
        - pnpm install
    build:
      commands:
        - pnpm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*